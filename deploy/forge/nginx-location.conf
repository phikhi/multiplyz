# Inside the Forge HTTPS server for teddy.phikhi.com.
# Keep Forge's TLS/ACME/includes; replace only the application location.
location / {
    proxy_pass http://127.0.0.1:3217;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nginx is the public edge: overwrite untrusted client-supplied IP headers.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
}
