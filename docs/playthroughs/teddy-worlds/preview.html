:root {
  /* TEDDy: accepted forest palette, fixed reading surfaces in both household themes. */
  --forest-bg: #173b32;
  --forest-deep: #12372c;
  --forest-cream: #fff7e7;
  --forest-ink: #284d3f;
  --forest-muted: #47634b;
  --forest-gold: #efd28e;
  --forest-gold-edge: #9b7841;
  --forest-mint: #b8dfbf;
  --forest-line: #7d9377;
  --forest-paper: #fffef5;
  --forest-soft: #e4ecd5;
  --forest-dot: #4f7957;
  --forest-added: #906b25;
  --forest-star: #806020;
  --forest-scrim: #09251fe8;
  --forest-shadow: 0 18px 60px #06251d44;
  --forest-panel-width: 420px;
  --forest-node-size: 54px;
  --forest-companion-size: 150px;
  --companion-album-width: 1160px;
  --companion-art-size: min(100%, 200px);
  --companion-portrait-size: min(100%, 440px);
  --companion-encounter-size: min(100%, 440px);
  --companion-halo: radial-gradient(ellipse, #b8dfbf40, #efd28e12 50%, transparent 72%);
  --companion-album-bg: radial-gradient(ellipse at top right, #46644488, transparent 65%);
  --companion-silhouette-filter: brightness(0) saturate(100%) invert(77%) sepia(15%) saturate(518%) hue-rotate(64deg);
  --forest-stage-height: 225px;
  --forest-viewport-min: 740px;
  --shard-card-width: 240px;
  --egg-shell-width: min(56vw, 230px);
  --egg-shell-radius: 52% 52% 46% 46% / 64% 64% 38% 38%;
  --egg-shell-bg: radial-gradient(ellipse at 34% 25%, #fffef5, #fff7e7 40%, #efd28e 78%, #9b7841);
  --egg-shell-shadow: inset -12px -15px 25px #9b784150, 0 18px 50px #09251f60;
  --egg-nest-bg: radial-gradient(ellipse at 50% 76%, #efd28e35, #b8dfbf18 40%, transparent 65%);
  --egg-shop-scrim: linear-gradient(90deg, #09251fdd, #09251f80 55%, #09251faa);
  --egg-float-distance: -8px;
  --egg-float-duration: 5s;

  /* ---------- COULEURS — fonds ---------- */
  --color-bg-primary:        #FAF7FF; /* fond principal (lavande crème) */
  --color-bg-secondary:      #FFFFFF; /* cartes / surfaces */
  --color-bg-tertiary:       #F1ECFB; /* champs / wells */
  --color-bg-inverse:        #29243D; /* fond inversé */

  /* ---------- COULEURS — texte ---------- */
  --color-text-primary:      #352F4D; /* texte principal (prune ardoise) */
  --color-text-secondary:    #6C6588;
  --color-text-tertiary:     #A39CBC; /* placeholder / désactivé */
  --color-text-inverse:      #FFFFFF;
  --color-text-link:         #5B39E0;

  /* ---------- COULEURS — bordures ---------- */
  --color-border-primary:    #E7E0F6;
  --color-border-secondary:  #F1ECFB;
  --color-border-focus:      #19C3B6;

  /* ---------- COULEURS — accents (action) ---------- */
  --color-accent-primary:        #7A5AF8; /* CTA (violet), texte blanc OK */
  --color-accent-primary-hover:  #6A47F0;
  --color-accent-primary-active: #5B39E0;
  --color-accent-secondary:      #19C3B6; /* turquoise (highlights, focus) */

  /* ---------- COULEURS — statuts (doux) ---------- */
  --color-status-success:    #2FB457;
  --color-status-warning:    #FFB020;
  --color-status-error:      #FF6B6B; /* corail doux, jamais agressif */
  --color-status-info:       #4DA3FF;
  /* Pastel doux du statut erreur (3ᵉ famille de badge, après success-bg/retry-bg) — story 7.7,
     carte de maîtrise « à renforcer ». Même luminosité approximative que
     --color-feedback-correct-bg/--color-feedback-retry-bg (badge fond clair constant + glyphe
     texte fort, jamais --color-status-error directement comme texte — piège #94/#104, ~2.7:1
     sur --color-bg-secondary en light, sous 4.5:1). */
  --color-status-error-bg:   #FFE8E6;
  /* Texte sur fond warning (ambre clair dans les 2 thèmes) — valeur sombre fixe,
     ne suit pas le thème. Assure le contraste AA (≥ 4.5:1) sur fond ambre. */
  --color-on-warning:        #29243D;

  --color-surface-overlay:   rgba(41, 36, 61, 0.45);

  /* ---------- COULEURS — jeu / récompenses ---------- */
  --color-reward-gold:       #FFC93C; /* étoiles, pièces */
  --color-reward-coral:      #FF6F61; /* cœurs, accents fun */
  --color-coin:              #FFC93C;
  --color-shard:             #19C3B6; /* éclats (cyan/turquoise) */
  --color-star:              #FFC93C;
  --color-star-empty:        #E7E0F6;

  /* feedback en jeu (toujours doublé d'une icône → daltonisme) */
  --color-feedback-correct:     #2FB457;
  --color-feedback-correct-bg:  #E3F8EC;
  --color-feedback-retry:       #FFB020; /* "pas encore" — jamais rouge */
  --color-feedback-retry-bg:    #FFF4DE;

  /* ---------- ESPACEMENT (base 16px, pas de 4px) ---------- */
  --space-0:  0;
  --space-1:  0.25rem; /*  4px */
  --space-2:  0.5rem;  /*  8px */
  --space-3:  0.75rem; /* 12px */
  --space-4:  1rem;    /* 16px */
  --space-5:  1.5rem;  /* 24px */
  --space-6:  2rem;    /* 32px */
  --space-7:  3rem;    /* 48px */
  --space-8:  4rem;    /* 64px */
  --space-9:  6rem;    /* 96px */
  --space-10: 8rem;    /* 128px */
  --space-11: 12rem;   /* 192px */
  --space-12: 16rem;   /* 256px */

  /* ---------- TYPOGRAPHIE ---------- */
  --font-family-display: "Baloo 2", system-ui, "Segoe UI", sans-serif; /* titres + chiffres */
  --font-family-body:    "Nunito", system-ui, "Segoe UI", sans-serif;  /* corps */
  --font-family-numeric: "Baloo 2", system-ui, sans-serif;             /* calculs */
  --font-family-mono:    ui-monospace, "SF Mono", monospace;

  --font-size-xs:   0.75rem;  /* 12 */
  --font-size-sm:   0.875rem; /* 14 */
  --font-size-base: 1rem;     /* 16 */
  --font-size-md:   1.125rem; /* 18 */
  --font-size-lg:   1.375rem; /* 22 */
  --font-size-xl:   1.75rem;  /* 28 */
  --font-size-2xl:  2.25rem;  /* 36 */
  --font-size-3xl:  3rem;     /* 48 */
  --font-size-4xl:  4rem;     /* 64 */
  --font-size-equation: 4.5rem; /* 72 — calcul affiché en grand */

  --font-weight-normal:   400;
  --font-weight-medium:   500;
  --font-weight-semibold: 600;
  --font-weight-bold:     700;

  --line-height-tight:   1.15;
  --line-height-normal:  1.5;
  --line-height-relaxed: 1.7;

  --letter-spacing-tight:  -0.01em;
  --letter-spacing-normal: 0;
  --letter-spacing-wide:   0.04em;

  /* ---------- LAYOUT ---------- */
  --max-width-content: 42rem;  /* lecture confortable */
  --max-width-wide:    64rem;
  --max-width-page:    75rem;
  --max-width-play:    34rem;  /* zone de jeu centrée (tablette portrait) */

  --border-radius-sm:   0.625rem; /* 10 */
  --border-radius-md:   1rem;     /* 16 */
  --border-radius-lg:   1.5rem;   /* 24 — cartes, boutons */
  --border-radius-xl:   2rem;     /* 32 */
  --border-radius-full: 9999px;

  /* ombres douces, légèrement teintées violet */
  --shadow-sm:    0 1px 2px rgba(53, 47, 77, 0.06);
  --shadow-md:    0 6px 16px rgba(122, 90, 248, 0.12);
  --shadow-lg:    0 16px 40px rgba(122, 90, 248, 0.18);
  /* Anneau de focus (issue #38, utilitaire `.mz-focusable:focus-visible` partagé,
     globals.css) — turquoise ASSOMBRI (même teinte que --color-border-focus,
     `#19C3B6` → `#129186`) à opacité PLEINE : la teinte claire d'origine
     (rgba(25,195,182,0.40)) ne franchissait QUE 1.37:1 une fois composée sur
     --color-bg-primary (#FAF7FF) — sous le seuil WCAG 1.4.11 (élément non-texte,
     ≥3:1). `#129186` opaque atteint ≥3.6:1 sur --color-bg-primary ET
     --color-bg-secondary (garde de test résolue depuis tokens.css, jamais
     seulement le nom du token — cf. globals.css.test.ts).
  */
  --shadow-focus: 0 0 0 4px rgba(18, 145, 134, 1);

  /* ---------- MOTION ---------- */
  --duration-instant: 50ms;
  --duration-fast:    150ms;
  --duration-normal:  250ms;
  --duration-slow:    400ms;
  --duration-slower:  600ms;

  --easing-default: cubic-bezier(0.4, 0, 0.2, 1);
  --easing-in:      cubic-bezier(0.4, 0, 1, 1);
  --easing-out:     cubic-bezier(0, 0, 0.2, 1);
  --easing-bounce:  cubic-bezier(0.34, 1.56, 0.64, 1); /* "juice" enfant */

  /* ---------- TOKENS COMPOSANTS ---------- */
  /* bouton-réponse (QCM) */
  --answer-bg:          var(--color-bg-secondary);
  --answer-border:      var(--color-border-primary);
  --answer-text:        var(--color-text-primary);
  --answer-radius:      var(--border-radius-lg);
  --answer-min-size:    4.5rem; /* 72px — grande cible tactile */
  --answer-correct-bg:  var(--color-feedback-correct-bg);
  --answer-retry-bg:    var(--color-feedback-retry-bg);

  /* pavé numérique */
  --keypad-key-bg:      var(--color-bg-tertiary);
  --keypad-key-text:    var(--color-text-primary);
  --keypad-key-radius:  var(--border-radius-md);

  /* carte / surface générique */
  --card-bg:      var(--color-bg-secondary);
  --card-radius:  var(--border-radius-lg);
  --card-shadow:  var(--shadow-md);

  /* top bar (pièces / éclats) — shell persistant (story R1.1 #337, WIREFRAMES §2
     « 🪙120  ✨40   ⚙️  👤 »). Déclarés depuis l'épic #5 mais restés SANS consommateur
     DOM jusqu'ici (piège #125 « déclaré ≠ rendu ») — `AppShell.tsx` les consomme. */
  --topbar-bg:     var(--color-bg-secondary);
  --topbar-border: var(--color-border-primary);
  --topbar-coin:   var(--color-coin);
  --topbar-shard:  var(--color-shard);
  /* --color-coin/--color-shard (comme --color-star/--color-reward-*) ÉCHOUENT le contraste
     texte/glyphe sur fond neutre (~1.5:1, rétro #104/#125/#126, cf. commentaires
     --map-node-star-filled et --collection-rarity-glyph plus bas) : jamais posés en
     `color` sur le CHIFFRE du solde (`--color-text-primary` fiable, ResultsScreen.tsx même
     règle) ni sur l'emoji (🪙/✨ = police emoji couleur native, `color` CSS sans effet dessus).
     Consommation SÛRE = un lavis DÉCORATIF dilué (`--topbar-*-tint` ci-dessous, `color-mix`
     12 % — même TECHNIQUE que --world-bg-tint #184/#199, dont le ratio propre est 10 % ; les
     deux ne sont PAS couplés en valeur, cf. JSDoc `AppShell.tsx`) derrière chaque pastille de
     solde — redondant avec l'emoji (jamais la SEULE info), donc hors du réquisit WCAG 1.4.11
     « objet graphique requis ». Formule dupliquée ici volontairement (couplage #184 : `color-mix` référençant
     une var `:root` re-résout correctement SEULEMENT si aucun descendant ne surcharge cette
     var en inline — non le cas ici, `--topbar-*` n'est jamais surchargé par élément). */
  --topbar-coin-tint:  color-mix(in srgb, var(--topbar-coin) 12%, var(--topbar-bg));
  --topbar-shard-tint: color-mix(in srgb, var(--topbar-shard) 12%, var(--topbar-bg));
  /* Hauteur totale du bandeau (tap-target 44px + padding vertical --space-2×2, story R1.1) —
     consommée par `AppShell.tsx` (sa propre `minHeight`) ET par CHAQUE écran du groupe `(app)`
     (`MapScreen`/`CollectionScreen`/`PlayScreen`) via `calc(100dvh - var(--app-shell-height))`
     sur leur `<main>`, jamais 100dvh brut, pour rester exactement un viewport. Ce calcul n'est
     FIDÈLE que parce qu'`AppShell` reste RÉELLEMENT sur UNE seule ligne à `--app-shell-height` à
     TOUTE largeur (icône SEULE sur ⚙️/👤, jamais de libellé visible — cf. JSDoc `AppShell.tsx`) :
     un bandeau qui passerait à la ligne (mesuré à 147px réels pour 60px déclarés, avant ce
     correctif) rendrait ce token FAUX et rognerait la marge sous la barre d'action `fixed`
     calibrée au pouce de `PlayScreen` (story 8.1 #254, régression réelle rencontrée puis
     corrigée à la source). Le bandeau reste EN FLUX partout (non-occlusion structurelle, jamais
     `position:fixed`, CLAUDE.md #278) : le seul coût résiduel est quelques px de capacité de
     scroll invisibles sous la marque de pli, jamais une occlusion. */
  --app-shell-height: calc(var(--tap-target-min) + var(--space-4));

  /* cible tactile mini (a11y) */
  --tap-target-min: 2.75rem; /* 44px */

  /* étayage visuel (scaffold) — conteneur monté en re-essai (WIREFRAMES §3d,
     épic #4). Famille sémantique dédiée : les étayages concrets (dix-cases /
     droite numérique / matrice, stories 4.2/4.3/4.4) s'y réfèrent sans valeur en
     dur. Surface neutre du thème courant (le thème per-monde --world-accent =
     épic #5, non câblé ici). */
  --scaffold-bg:          var(--color-bg-tertiary);
  --scaffold-padding:     var(--space-4);
  --scaffold-radius:      var(--border-radius-md);
  --scaffold-min-height:  var(--space-8); /* 64px — hauteur de repli du placeholder */
  --scaffold-glyph-color: var(--color-text-tertiary);

  /* dix-cases (story #94, TenFrame) — cases remplies vs à-compléter distinguées par
     motif ET couleur (jamais couleur seule, a11y daltonisme). Même famille sémantique
     que --scaffold-*, référence des tokens existants uniquement. Le glyphe de chaque
     état a une COULEUR PROPRE qui contraste sur SON fond (rétro #94 : un token unique
     rendait le `○` vide invisible sur la surface neutre en light ET dark). */
  --scaffold-cell-size:        var(--space-6); /* 32px — case carrée */
  --scaffold-cell-gap:         var(--space-2);
  --scaffold-cell-radius:      var(--border-radius-sm);
  --scaffold-cell-filled-bg:   var(--color-accent-primary);
  --scaffold-cell-filled-border: var(--color-accent-primary-active);
  --scaffold-cell-filled-glyph:  var(--color-text-inverse); /* blanc sur l'accent (2 thèmes) */
  --scaffold-cell-empty-bg:    var(--color-bg-secondary);
  --scaffold-cell-empty-border: var(--color-border-primary);
  --scaffold-cell-empty-glyph:   var(--color-text-primary); /* texte fort sur surface neutre (2 thèmes) */

  /* droite numérique (story #95, NumberLine — add/sub) — même famille sémantique
     que --scaffold-*, référence des tokens existants uniquement. Le sens du saut
     (avance/recul) N'EST JAMAIS porté par la seule couleur — texte + icône flèche
     + ARC tracé sur la ligne (a11y daltonisme, cf. rétro #94 : tout glyphe sur fond
     neutre = token texte contrastant SUR CE fond dans les 2 thèmes, jamais
     --color-text-inverse). Les éléments porteurs de sens (graduation, arc) atteignent
     ≥ 3:1 sur le fond neutre du scaffold (WCAG 1.4.11) dans les 2 thèmes. */
  --scaffold-line-track:        var(--color-border-primary); /* trait de la droite, surface neutre */
  --scaffold-line-tick:         var(--color-text-secondary);  /* graduations (≥3:1 sur fond neutre, 2 thèmes) */
  --scaffold-line-tick-label:   var(--color-text-secondary); /* chiffres des graduations */
  --scaffold-line-start-bg:     var(--color-bg-secondary);   /* point de départ (a) */
  --scaffold-line-start-border: var(--color-border-primary);
  --scaffold-line-start-glyph:  var(--color-text-primary);   /* texte fort sur surface neutre (2 thèmes) */
  --scaffold-line-end-bg:       var(--color-accent-primary); /* point d'arrivée (correctAnswer) */
  --scaffold-line-end-border:   var(--color-accent-primary-active);
  /* fix #104 (rétro #94, piège récurrent) : le chiffre d'arrivée est rendu SOUS la
     pastille, sur le fond NEUTRE du panneau — pas sur l'accent plein de la pastille
     elle-même. --color-text-inverse (blanc) y était donc invisible (blanc sur clair).
     Même token que --scaffold-line-start-glyph : texte fort contrastant sur surface
     neutre, ≥ 11.9:1 les 2 thèmes (jamais --color-text-inverse hors fond accent plein). */
  --scaffold-line-end-glyph:    var(--color-text-primary);
  --scaffold-line-jump-arc:     var(--color-accent-primary-active); /* arc du saut (violet profond, ≥3:1 fond neutre 2 thèmes, distinct du point d'arrivée) */
  --scaffold-line-point-size:   var(--space-5); /* 24px — pastille départ/arrivée */
  /* Épaisseur du trait de la droite ET de l'arc du saut (issue #110, dette pré-#102) —
     un seul token pour les deux (même ligne visuelle), jamais `2px`/`strokeWidth`
     en dur dans NumberLine.tsx. */
  --scaffold-line-track-width:  2px;

  /* matrice (story #96, Matrix — mult) — même famille sémantique que --scaffold-*,
     référence des tokens existants uniquement. Modèle « groupes répétés » (PRODUCT
     §3.4 : a × b = a paquets de b) : chaque PAQUET (ligne) est un conteneur bordé +
     fond distinct de la surface neutre du panneau, séparé par une gouttière — le
     regroupement est donc VISIBLE par structure/bordure, jamais par la seule couleur
     (a11y daltonisme, rétro #95 « le modèle doit être DESSINÉ, pas juste décrit »).
     Points contrastants sur le fond de paquet dans les 2 thèmes (jamais
     --color-text-inverse hors fond accent plein — piège #94/#104 récurrent). */
  --scaffold-matrix-row-bg:      var(--color-bg-secondary);   /* fond du paquet, distinct de --scaffold-bg */
  --scaffold-matrix-row-border:  var(--color-border-primary); /* bordure du paquet (regroupement spatial) */
  --scaffold-matrix-row-radius:  var(--border-radius-sm);
  --scaffold-matrix-row-gap:     var(--space-2); /* gouttière ENTRE paquets (rangées) */
  --scaffold-matrix-dot-size:    var(--space-4); /* 16px — point d'une matrice */
  --scaffold-matrix-dot-gap:     var(--space-1); /* espace entre points d'un même paquet */
  --scaffold-matrix-dot-color:   var(--color-accent-primary-active); /* point, ≥3:1 sur fond de paquet (2 thèmes) */

  /* carte du monde (story #125, WIREFRAMES §2, MAP §2/§4/§5) — chemin de nœuds
     Candy Crush. Même famille sémantique que --scaffold-* (référence des tokens
     existants uniquement, aucune valeur en dur). Piège #94→#104 (récidivant) :
     --color-text-inverse est réservé à un fond ACCENT PLEIN — jamais posé sur un
     fond neutre. Les couleurs "vives" de récompense (--color-reward-gold/-coral,
     --color-star, --color-status-info) sont des ACCENTS DÉCORATIFS, PAS des
     couleurs de glyphe/texte fiables sur fond neutre (vérifié : ratio <2:1 sur
     --color-bg-tertiary/-primary en light — piège identique #94/#104, à ne PAS
     reproduire ici). Tout glyphe/icône de nœud utilise donc un token TEXTE
     (--color-text-primary/-secondary/-tertiary/-inverse) résolu ≥4.5:1 sur SON
     fond réel dans les 2 thèmes ; le TYPE de nœud est distingué par la FORME du
     glyphe (cadenas/étoile/coffre/couronne), jamais par une couleur seule
     (a11y daltonisme) — cohérent avec le contrat scaffold (rétro #94). */
  --map-node-size:            var(--space-8); /* 64px — pastille de nœud, ≥ tap-target-min */
  --map-node-gap:             var(--space-6); /* espacement vertical du chemin */
  /* Connecteur du chemin (trait reliant deux nœuds consécutifs, métaphore Candy
     Crush, WIREFRAMES §2). GUIDE VISUEL DE REPÉRAGE (wayfinding) rendu VISIBLE
     (ADR 0010, playtest : le trait quasi-invisible + le jitter léger donnaient
     l'impression de ronds désalignés = bug d'affichage ressenti). Remappé sur
     `--color-text-secondary` → ≥3:1 sur --color-bg-primary les 2 thèmes
     (#6C6588/#FAF7FF ≈ 5:1 light ; #B5AED0/#1C1830 ≈ 8:1 dark) conformément à
     WCAG 1.4.11 (élément non-texte). Choix NEUTRE délibéré (pas un token de
     statut) pour ne pas concurrencer les couleurs des états de nœud
     (vert complété / violet courant / neutre verrouillé). Reste `aria-hidden` /
     jamais navigable : l'ORDRE du chemin est déjà porté par l'ordre DOM des
     nœuds + leurs noms accessibles → le trait n'ajoute aucune info nouvelle pour
     un lecteur d'écran. Garde de contraste RÉSOLUE ≥3:1 (2 thèmes) exigée
     (MapScreen.test.tsx) — le token porte désormais une intention visuelle
     revendiquée, donc testée (cf. CLAUDE.md, tell commentaire↔code). */
  --map-node-path-color:      var(--color-text-secondary);
  --map-node-path-width:      4px;
  /* Casing opaque du trait (story #202, généralisation du scrim #189) : quand une PHOTO IA
     arbitraire du monde est active (`theme.background !== null`), le trait est peint directement
     dans la gouttière de `<main>` (backmost) — sur la fixture E2E rayée le violet du motif ramène
     le trait à ~1.21:1 (quasi invisible), contre ~4.7:1 sur le fond neutre par défaut. Une photo
     ARBITRAIRE ne permet AUCUNE garantie analytique de contraste (#170) ⇒ même patron que le scrim
     du titre : une CASING opaque (`--world-surface`) posée dessous avant le trait coloré (jamais
     dans l'état tint-seul/neutre, #199 — palette d'accent bornée, contraste déjà prouvé
     analytiquement, cf. MapScreen.test.tsx). Largeur = --space-2 (8px, > les 4px du trait) pour
     déborder visiblement de part et d'autre du trait fin. */
  --map-node-path-casing-width: var(--space-2);
  /* verrouillé : fond neutre en retrait, glyphe cadenas = texte fort sur cette
     surface neutre (--color-text-primary, ≥10.8:1 les 2 thèmes — jamais
     --color-text-inverse, fond non accent). */
  --map-node-locked-bg:       var(--color-bg-tertiary);
  --map-node-locked-border:   var(--color-border-primary);
  --map-node-locked-glyph:    var(--color-text-primary);
  /* courant : pastille sur fond ACCENT PLEIN → --color-text-inverse valide ici
     (glyphe blanc sur violet plein, ≥4.5:1 les 2 thèmes — exception fond accent). */
  --map-node-current-bg:      var(--color-accent-primary);
  --map-node-current-border:  var(--color-accent-primary-active);
  --map-node-current-glyph:   var(--color-text-inverse);
  /* terminé : fond succès doux (PAS un accent plein) → glyphe = texte fort sur
     surface claire (--color-text-primary, ≥10:1 les 2 thèmes), jamais
     --color-text-inverse ici (piège #94/#104 — fond pastel, pas accent plein). */
  --map-node-completed-bg:      var(--color-feedback-correct-bg);
  --map-node-completed-border:  var(--color-feedback-correct);
  --map-node-completed-glyph:   var(--color-text-primary);
  /* badge de TYPE (normal/trésor/boss/révision) : petit médaillon superposé au
     nœud, fond clair constant + glyphe texte fort — ≥12:1 les 2 thèmes (surface
     neutre choisie précisément parce qu'elle ne varie pas avec le statut du
     nœud). Le type est porté par la FORME du glyphe (coffre/couronne/flèche),
     jamais par une couleur d'accent seule. */
  --map-node-type-badge-bg:     var(--color-bg-secondary);
  --map-node-type-badge-border: var(--color-border-primary);
  --map-node-type-badge-glyph:  var(--color-text-primary);
  /* étoiles (0..3, MAP §4 — récompense d'affichage, jamais une barrière).
     --color-star échoue le contraste sur fond neutre en light (~1.5:1, réservé
     aux surfaces sombres) — mêmes tokens texte fiables que le reste de la
     carte, remplie vs vide distinguées par FORME (★ plein / ☆ contour) ET
     couleur (rétro #94 : jamais la forme seule). --color-text-tertiary
     n'atteint PAS 4.5:1 sur --color-bg-secondary (2.61:1 light) — utiliser
     --color-text-secondary (≥5.4:1 les 2 thèmes) pour l'étoile vide. */
  --map-node-star-filled:  var(--color-text-primary);
  --map-node-star-empty:   var(--color-text-secondary);
  /* Médaillon BLANC des étoiles (playtest owner : sortir les étoiles du flux pour
     que le trait du chemin ne les traverse pas + les poser sur une pastille opaque
     sous laquelle le trait passe). Fond = --color-bg-secondary (#FFFFFF light /
     #272240 dark, comme le médaillon de type) → les étoiles y passent le contraste
     (filled --color-text-primary ~13:1 ; empty --color-text-secondary ≥5.4:1 les 2
     thèmes, cf. commentaire ci-dessus). Le fond de RÉFÉRENCE du contraste des
     étoiles devient donc --color-bg-secondary (le vrai fond empilé), plus
     --color-bg-primary (rétro #125/#126 : fond réel derrière le glyphe). */
  --map-node-star-badge-bg:     var(--color-bg-secondary);
  --map-node-star-badge-border: var(--map-node-type-badge-border);

  /* ---------- RICHESSE VISUELLE PER-MONDE (tuiles + Teddy, story #190) ----------
     WORLDGEN §4 : chaque monde porte des « tuiles de carte » (décor) + une variante
     Teddy per-monde (ancrée img2img sur le master figé #158, ADR 0009). Ces deux
     assets sont RENDUS sur la carte (déclaré ≠ consommé, #125) UNIQUEMENT quand le
     monde résolu fournit une ref validée (`isRenderableAssetRef`) ; sinon l'élément
     n'est pas rendu (repli propre, aucun `<img>`/`background-image` vers une URL non
     validée — même garde de sécurité que le fond, story 6.7). */
  /* Bande de décor thématisée (tuiles du monde) : élément DÉCORATIF (aria-hidden)
     rendu SOUS le bandeau d'accent et AU-DESSUS du chemin — jamais derrière un glyphe
     ni le connecteur (zéro régression contraste #104/#125/#170 : aucun texte ni trait
     n'est empilé dessus, le fond de référence des glyphes de nœud reste inchangé).
     Repli teinté `--world-bg-tint` per-monde sous l'image (hérité de <main>, fix #184).
     Hauteur inchangée (96px, ⚙️ playtest #203) : la question du proprio portait sur la
     LECTURE (« décor intentionnel ou bandeau orphelin ? »), pas la taille — corrigée en
     habillant la bande d'un cadre (`--map-tiles-border`/`--map-tiles-shadow`, cf.
     `WorldTilesBand`) plutôt qu'en changeant la hauteur : un bandeau plein-largeur SANS
     bordure visible se fond dans le fond de carte (surtout en tint-seul #199, même
     famille de couleur) → lu comme un artefact, pas un élément posé.
     ⚠️ BORDURE = neutre DISTINCTEMENT SOMBRE, PAS `--color-border-primary` (piège #226/#170,
     round 2 Frontend) : `--color-border-primary` (neutre CLAIR, #E7E0F6 light) n'atteint
     que ~1.1–1.2:1 RÉSOLU contre `--world-bg-tint` (accent 10 % sur surface) → bordure
     fonctionnellement INVISIBLE dans l'état tint-seul (le scénario le plus à risque). La
     capture texturée E2E masquait le trou par contraste fortuit avec le motif rayé, PAS
     avec la bordure — attrapé au calcul WCAG résolu, pas au pixel-look. Remappée sur
     `--color-text-secondary` (le MÊME neutre sombre que `--map-node-path-color`, son
     JUMEAU déjà prouvé ≥3:1 résolu contre le tint pour les 6 accents curatés × 2 thèmes,
     MapScreen.test.tsx) → ≥3:1 garanti (élément non-texte, WCAG 1.4.11), donc bordure
     RÉELLEMENT visible qui fait lire la bande comme un « médaillon carte postale »
     intentionnel. La `--card-shadow` seule ne suffit PAS (non fiable/non testable) : c'est
     la BORDURE qui porte la séparation, l'ombre ne fait que la renforcer. Contraste
     mutation-prouvé (MapScreen.test.tsx : rougit sous `--color-border-primary`, vert sous
     `--color-text-secondary`). Purement décoratif (aucun texte empilé sur la bande). */
  --map-tiles-height:  var(--space-9); /* 96px — hauteur de la bande de décor */
  --map-tiles-radius:  var(--card-radius);
  /* Bordure ≥3:1 résolu contre --world-bg-tint (6 accents × 2 thèmes, cf. jumeau
     --map-node-path-color) — jamais un neutre clair (#226, invisible sur le tint). */
  --map-tiles-border:  var(--color-text-secondary);
  --map-tiles-shadow:  var(--card-shadow);
  /* Avatar Teddy per-monde : marqueur « tu es ici » posé AU-DESSUS du médaillon du
     nœud COURANT (mascotte-guide, MAP §1 point de reprise). Décoratif (aria-hidden :
     le nœud porte déjà son nom accessible complet → pas de double annonce). Élément
     SUPERPOSÉ/positionné → garde DOUBLÉE pixels + géométrie (non-occlusion #170) : il
     flotte au-dessus de la pastille, ne recouvre jamais le glyphe de statut centré.
     ⚙️ playtest #203 : le proprio a rapporté Teddy à la fois « trop petit » (32px, fix
     #170) ET « qui chevauche » — deux forces opposées. Recalibré à 40px
     (`calc(--space-6 + --space-2)`, +25 % de présence) EN DURCISSANT SIMULTANÉMENT la
     marge de sécurité amont : `CurrentNodeTeddy` approfondit son chevauchement décoratif
     du haut du médaillon de -8px (--space-2) à -16px (--space-4) — l'avatar « coiffe »
     davantage son PROPRE médaillon (glyphe de statut toujours dégagé, marge aval 16px,
     jamais < la moitié du rayon) au lieu de déborder vers le médaillon AMONT. Marge amont
     inchangée = 8px : l'avatar dépasse `40 − 16 = 24px` AU-DESSUS de son médaillon (taille
     40 moins chevauchement 16), la gouttière inter-nœuds vaut 32px, donc `32 − 24 = 8px`
     de marge sous le médaillon amont — même delta que le fix #170 original, revérifiée par
     la garde E2E `teddyTop ≥ bas du médaillon amont`, jamais raisonnée seule (rétro
     #190/#203). Un 48px symétrique (chevauchement inchangé -8px) dépasserait `48 − 8 = 40px`
     > 32px de gouttière → occlusion originale #170 : c'est le COUPLE taille+chevauchement
     qui doit varier ensemble, pas la taille seule. */
  --map-node-teddy-size:  calc(var(--space-6) + var(--space-2)); /* 40px — avatar Teddy sur le nœud courant */

  /* ---------- TEDDY DANS LA BOUCLE DE JEU (story R2.2, #360, ART §2/§8) ----------
     Tailles de l'avatar Teddy `<AssetImage>` rendu **EN FLUX** (jamais superposé/absolu,
     donc non-occlusion STRUCTURELLE — rétro #278b : un enfant en flux réserve un espace
     réel et pousse le contenu, il ne peut PAS occulter par construction, contrairement au
     `CurrentNodeTeddy` absolu de la carte qui exige la garde géométrie #170). L'image porte
     une largeur token, la hauteur suit le ratio intrinsèque du sprite (portrait 262×359).
     Sprite transparent sur fond neutre : aucun contraste texte à garantir (l'illustration
     n'est pas un glyphe, hors #104/#226). */
  --teddy-hero-size:      var(--space-8);  /*  64px de LARGE → ~88px de haut (sprite portrait) —
                                               Teddy d'accueil (ProfileSelector). Volontairement
                                               compact : l'accueil empile déjà marque + titre +
                                               liste de profils + entrée « 🔒 Parent » ; un hero
                                               trop grand pousse l'entrée parent hors de l'écran
                                               (garde E2E de non-occlusion/in-viewport, #170/#190). */
  --teddy-feedback-size:  var(--space-8);  /*  64px — Teddy du feedback en niveau */
  --teddy-results-size:   var(--space-9);  /*  96px — Teddy de l'écran de résultats */

  /* étoiles de l'écran de RÉSULTATS (fin de niveau, story #126/5.5) — même piège
     que --map-node-star-* ci-dessus : --color-star/--color-star-empty sont des
     accents décoratifs qui échouent le contraste sur le fond de page neutre
     --color-bg-primary (~1.45:1 / 1.21:1, quasi invisibles — rétro #104/#125).
     Mêmes tokens texte fiables (≥4.5:1 les 2 thèmes), remplie vs vide distinguées
     par FORME (★ plein / ☆ contour) ET couleur (rétro #94 : jamais la forme seule). */
  --results-star-filled:  var(--color-text-primary);
  --results-star-empty:   var(--color-text-secondary);

  /* Art de la légendaire au BOSS REVEAL (story #387, discovered en review #386, extension
     R3.2 #379/#170/#180) : moment le PLUS dramatique du jeu (légendaire unique, 1×/monde,
     gagnée au boss) — rendait à `--space-8` (64px), le PLUS PETIT élément de l'écran
     résultats (< Teddy 96px `--teddy-results-size`, < 1/3 de la fiche créature 216px
     `--creature-detail-art-size`). ⚙️ calibrable (playtest enfant) : `min(9rem, 40vw)`
     ≈ 128-144px — décisivement > 64px, ≥ Teddy (96px), mais SANS le plein 216px de la
     fiche (budget vertical résultats plus serré : titre + Teddy + étoiles + pièces + carte
     légendaire + message + CTA doivent tous tenir, contrairement à la fiche qui n'a que
     titre + art + stade/histoire + retour). Token DÉDIÉ, jamais `--space-8` (une valeur
     d'espacement réutilisée comme taille d'art masque un ⚙️ de magnitude visuelle sous un
     nom générique — CLAUDE.md « paramètre nommé par une spec »). Garde-MAGNITUDE E2E (pas
     garde-plancher, rétro R3.2 #379 : `artBox.width >= 80` restait vert sur un rendu
     sous-livré) : `auth.spec.ts` asserte `artBox.width >= 110`, rougit si ce token régresse
     vers 64px. */
  --results-legendary-art-size: min(9rem, 40vw);

  /* ---------- ESPACE PARENT — TABLEAU DE BORD (story 7.7, WIREFRAMES §7,
     PLAN §Espace parent) ----------
     Assemblage des agrégats read-only 7.2/7.4 (justesse/rapidité/maîtrise/à-revoir/
     régularité). AUCUN élément superposé/positionné (pas d'`absolute`, pas de z-index) :
     barres et cellules sont des frères en flux normal → hors du périmètre occlusion #170
     par construction. Chaque glyphe/trait distinct référencé ci-dessous a son propre test
     de contraste résolu (garde CLAUDE.md #104/#125/#126). */
  /* Barres « par compétence » (justesse, WIREFRAMES §7 « Compléments ███████░ 88% ») :
     le POURCENTAGE (texte) est TOUJOURS rendu à côté, sur --card-bg, avec un token texte
     déjà prouvé ≥4.5:1 — jamais À L'INTÉRIEUR de la barre (évite catégoriquement le piège
     opacity/blend #226 et le piège texte-sur-accent #94/#104). La barre elle-même est un
     élément NON-TEXTE (WCAG 1.4.11, ≥3:1 fill vs track). */
  --parent-bar-track-bg:    var(--color-bg-tertiary);
  --parent-bar-fill-bg:     var(--color-accent-primary);
  --parent-bar-height:      var(--space-3); /* 12px */
  --parent-bar-radius:      var(--border-radius-full);
  /* Carte de maîtrise (heatmap maîtrisé/en-cours/à-renforcer, PLAN §Espace parent) : même
     patron que les badges de nœud de carte (`--map-node-completed-*`) — fond PASTEL
     constant (2 thèmes) + bordure de statut + GLYPHE = texte fort (`--color-text-primary`),
     jamais le token de statut directement comme texte (piège #94/#104 récurrent : les
     accents/status ne passent pas 4.5:1 sur un fond clair). 3 glyphes DISTINCTS (✓/~/!) —
     jamais la couleur seule (a11y daltonisme), doublés du mot (Maîtrisé/En cours/À renforcer). */
  --parent-mastery-mastered-bg:      var(--color-feedback-correct-bg);
  --parent-mastery-mastered-border:  var(--color-feedback-correct);
  --parent-mastery-mastered-glyph:   var(--color-text-primary);
  --parent-mastery-inprogress-bg:     var(--color-feedback-retry-bg);
  --parent-mastery-inprogress-border: var(--color-feedback-retry);
  --parent-mastery-inprogress-glyph:  var(--color-text-primary);
  --parent-mastery-weak-bg:     var(--color-status-error-bg);
  --parent-mastery-weak-border: var(--color-status-error);
  --parent-mastery-weak-glyph:  var(--color-text-primary);
  --parent-mastery-badge-size:  var(--space-6); /* 32px */
  /* Graphique de régularité (minutes/jour, derniers jours — réalise honnêtement la
     métaphore « sparkline » du wireframe avec de VRAIES données journalières régularity.days).
     Barres verticales en flux (`flex`, jamais `position:absolute`) → aucune garde d'occlusion
     requise par construction. NB (issue #241, ADR 0018) : la justesse quotidienne QUE ce
     commentaire annonçait absente est désormais réalisée par `--parent-accuracy-sparkline-*`
     ci-dessous — `AccuracyStats` (ADR 0012, `stats.ts`) reste inchangée (current/previous
     seulement), la série vit dans le module SŒUR `accuracy-daily.ts`. */
  --parent-chart-track-bg:   var(--color-bg-tertiary);
  /* `--color-accent-secondary` (turquoise) n'atteint QUE ~1.9:1 sur `--color-bg-tertiary` en light
     (trop clair/saturé pour un remplissage non-texte, piège #104/#125 générique aux accents vifs
     sur fond pastel) → même paire ÉPROUVÉE que la barre de justesse (`--parent-bar-fill-bg`,
     ≥3:1 résolu 2 thèmes, `ParentDashboard.test.tsx`), variante -active pour une nuance distincte
     visuellement de la barre de justesse tout en gardant le contraste. */
  --parent-chart-fill-bg:    var(--color-accent-primary-active);
  --parent-chart-bar-width:  var(--space-3);
  --parent-chart-max-height: var(--space-8); /* 64px */
  /* Sparkline de justesse QUOTIDIENNE (issue #241, ADR 0018, `AccuracySparkline` dans
     `ParentDashboard.tsx`) — réutilise la GÉOMÉTRIE du graphique de régularité ci-dessus
     (`--parent-chart-bar-width`/`--parent-chart-max-height`/`--parent-chart-track-bg`, même
     échelle visuelle de « petit graphique en barres »), mais un remplissage DÉDIÉ pour rester
     visuellement distinct du temps de jeu (régularité) : même token que la barre de justesse par
     compétence (`--parent-bar-fill-bg` = `--color-accent-primary`), testé ≥3:1 EXPLICITEMENT sur
     `--parent-chart-track-bg` (jamais supposé identique à un autre couple déjà testé — chaque
     paire consommée a sa propre garde, `ParentDashboard.test.tsx`). Barres verticales en flux
     (`flex`) → aucune garde d'occlusion requise par construction. */
  --parent-accuracy-sparkline-fill-bg: var(--color-accent-primary);
  /* Puce « à revoir » (chip de calcul à réviser en priorité, WIREFRAMES §7). */
  --parent-review-chip-bg:     var(--color-bg-tertiary);
  --parent-review-chip-text:   var(--color-text-primary);
  --parent-review-chip-radius: var(--border-radius-full);

  /* ---------- COLLECTION (Pokédex, story 5.6, WIREFRAMES §5/§8) ----------
     Écran collection : cartes de créatures possédées + fiche + renommage.
     Chaque glyphe/texte rendu utilise un token TEXTE fiable (≥4.5:1 sur son fond
     réel), jamais un accent décoratif (--color-star/--color-coin) qui échoue le
     contraste sur fond neutre (rétro #104/#125/#126). */
  /* Grille du Pokédex : **3 colonnes** (WIREFRAMES §8 « Collection : grille 3
     colonnes » — vaut sur téléphone ET desktop, où la grille est centrée dans
     --max-width-play). Valeur ⚙️ centralisée (jamais un nombre en dur dans le
     composant). `repeat(3, minmax(0, 1fr))` tient jusqu'à 320px : la zone est
     bornée à --max-width-play, le gap resserré (--collection-grid-gap) et le
     padding de carte réduit (--collection-card-padding) évitent tout débordement. */
  --collection-grid-columns:  3;
  --collection-grid-gap:      var(--space-2);
  --collection-card-padding:  var(--space-2);
  /* Description (histoire) de carte — lisibilité à 375px, cartes ~105px (issue #272,
     playtest-⚙️, découvert en review 8.2b #266/#271). Le proprio a confirmé au playtest :
     texte carte collection trop petit. `--font-size-sm` (14px) enchaînait un mur de 3+ lignes
     fragmentées (ex. « Douce comme une feuille. » cassant sur 3 lignes) → sensation de texte
     minuscule pour une enfant de 8 ans, même sur des histoires courtes. Fix : police un cran
     au-dessus (`--font-size-base`, 16px, hors zone « minuscule » xs/sm) + troncature PROPRE
     2 lignes (ellipsis) au lieu d'un mur de texte fragmenté sur 3+ lignes irrégulières.
     **3 colonnes PRÉSERVÉES** (WIREFRAMES §8, `--collection-grid-columns` inchangé) — seule la
     description change, jamais la géométrie de grille. */
  --collection-card-description-font-size: var(--font-size-base);
  --collection-card-description-line-clamp: 2;
  /* Slot d'illustration de créature (le VRAI art `<AssetImage>` R2.1 #361 OU le repli placeholder
     emoji) dimensionné pour tenir dans une carte de grille 3-colonnes à 320px. --space-7 (48px) <
     largeur de contenu de carte au pire cas → géométrie 3-col inchangée quel que soit l'art. */
  --collection-placeholder-size: var(--space-7);
  /* Padding horizontal de l'écran collection : resserré pour maximiser la largeur de grille
     sur téléphone (3 colonnes, WIREFRAMES §8) sans jamais de scroll horizontal. */
  --collection-page-padding:  var(--space-4);
  --collection-card-bg:      var(--color-bg-secondary); /* fond de carte de créature */
  --collection-card-border:  var(--color-border-primary);
  /* texte de carte (nom, compteur) sur le fond de carte clair — ≥4.5:1 les 2 thèmes */
  --collection-text:         var(--color-text-primary);
  --collection-text-muted:   var(--color-text-secondary); /* histoire, méta (≥4.5:1) */
  /* Badge de rareté : le LABEL texte (« légendaire ») porte l'info (a11y daltonisme),
     doublé d'un glyphe distinct par rareté. La couleur du glyphe/label = token TEXTE
     fiable sur le fond de carte (jamais --color-star sur fond neutre — piège #126).
     La légendaire est mise en avant par un glyphe étoile ET le mot « légendaire »,
     pas par une couleur d'accent seule. */
  --collection-rarity-glyph: var(--color-text-primary); /* glyphe de rareté (★/◆/●) — ≥4.5:1 */
  /* silhouette placeholder (art réel épic #6) : fond neutre + glyphe texte fort */
  --collection-placeholder-bg:    var(--color-bg-tertiary);
  --collection-placeholder-glyph: var(--color-text-primary);

  /* ---------- FICHE CRÉATURE (détail + histoire, story R3.2 #379, WIREFRAMES §5b) ----------
     Écran dédié accessible depuis une carte de la Collection. Réutilise DIRECTEMENT les tokens
     --collection-card-bg/border/text/text-muted/rarity-glyph/placeholder-* ci-dessus (même
     langage visuel de carte de créature, déjà ≥4.5:1 prouvé — aucun doublon de token). Le SEUL
     token propre à cet écran est la taille de l'art : le payoff EN GRAND (#180, note R3.1 « fiche
     montre l'art en grand » + review R3.2 Frontend/Game-design : la créature DOIT DOMINER la carte,
     c'est le moment-révélation, jamais une vignette timide). ⚙️ calibrable (playtest enfant) :
     `min(13.5rem, 62vw)` ≈ 216px sur desktop/tablette (la créature domine la carte ≤34rem), et
     scale-DOWN sur téléphone étroit (62vw = 232px @375px → plafonné à 216px ; 198px @320px) pour
     ne JAMAIS déborder la carte bornée à --max-width-play sur petit écran. Nettement au-dessus de
     --collection-placeholder-size (48px, vignette de grille). */
  --creature-detail-art-size: min(13.5rem, 62vw);

  /* ---------- BOUTIQUE / ŒUFS — ART DE LA CRÉATURE RÉVÉLÉE (story R4.2 #393, WIREFRAMES §6b) ----------
     L'art de la créature tirée à l'OUVERTURE D'UN ŒUF est LE moment de gratification de la boucle de
     DÉPENSE (gacha, ECONOMY §4.2/§6) — l'art est le HÉROS de l'écran (WIREFRAMES §6b « [créature] ! »
     centrée, en grand). C'est une magnitude-valued reveal, EXACTEMENT la classe promue en règle dure
     (garde-MAGNITUDE, RÉCIDIVE 3× R3 : fiche #379, boss-reveal #381/#387) → token DÉDIÉ, jamais une
     valeur d'espacement réutilisée (qui masquerait le ⚙️ de magnitude sous un nom générique). L'écran
     d'ouverture est DÉDIÉ/plein (titre + art + beat Teddy + CTA, budget vertical large) → l'art peut
     être plus grand que le boss-reveal (`--results-legendary-art-size` ~128-144px, budget résultats
     serré) : ⚙️ calibrable (playtest enfant) `min(15rem, 66vw)` ≈ 240px desktop/tablette, scale-DOWN
     sur téléphone (66vw = 247px @375px → plafonné 240px ; 211px @320px) pour ne jamais déborder la
     carte bornée à --max-width-play. Garde-MAGNITUDE E2E (PAS garde-plancher, rétro R3.2 #379 :
     `artBox.width >= 80` restait vert sur un rendu sous-livré) : `auth.spec.ts` asserte
     `artBox.width >= 180`, rougit si ce token régresse vers une vignette (< ~180px). */
  --egg-reveal-art-size: min(15rem, 66vw);

  /* ---------- RESPONSIVE — BREAKPOINT ÉCRAN DE JEU (story 8.1 #254, WIREFRAMES §8) ----------
     UN SEUL breakpoint numérique consommé par cette story : --bp-phone (téléphone vs
     tablette/desktop, qui restent GROUPÉS — WIREFRAMES §8 « tablette/desktop : disposition
     actuelle préservée », aucun comportement distinct tablette n'est consommé ICI). Pas de
     --bp-tablet déclaré (anti-token-orphelin #125) : aucun code de CETTE story ne le
     consommerait — à ajouter par une story qui le consomme réellement (8.2+, carte/collection/
     boutique).
     ⚠️ Les media queries CSS ne peuvent PAS référencer une custom property dans leur condition
     (`@media (max-width: var(--x))` est invalide CSS) — ce token est donc consommé CÔTÉ JS
     (`useIsPhone`, `src/lib/responsive/use-is-phone.ts`) via
     `getComputedStyle(document.documentElement).getPropertyValue('--bp-phone')` À L'EXÉCUTION
     RÉELLE (vrai navigateur) : AUCUNE valeur dupliquée en dur dans les composants, tokens.css
     reste la SEULE source du nombre (jsdom ne résout pas les custom properties déclarées par
     fichier importé → repli JS documenté et testé séparément dans ce module, jamais atteint en
     navigateur réel où tokens.css est toujours chargé via globals.css). */
  --bp-phone: 30rem; /* 480px — sous ce seuil : QCM 2×2 (déjà natif, verrouillé par garde E2E),
                         numpad pleine largeur, barre d'action en bas (zone pouce) */

  /* Barre d'action bas de zone pouce (ActionBar, story 8.1 #254, WIREFRAMES §8 « boutons
     d'action en bas, zone pouce » — téléphone uniquement). Hauteur RÉSERVÉE consommée à la
     fois par la barre elle-même (min-height) ET par le padding-bottom du contenu défilant
     au-dessus (`PlayScreen.tsx`) — évite toute occlusion du dernier contenu jouable par la
     barre fixe (#170/#190), prouvé par la garde E2E boundingClientRect (jamais une marge
     seulement raisonnée, #190). */
  --play-action-bar-height: var(--space-9); /* 96px */

  /* ---------- CONTRAT PER-MONDE (override dynamique) ----------
     Chaque monde généré pose --world-accent (via [data-world] ou style
     inline). Défaut = neutre. Le reste du système ne change pas. */
  --world-accent:   var(--color-accent-secondary);
  /* tint = wash translucide de l'accent SUR la surface du thème courant →
     reste lisible en light ET dark.
     ⚠️ #184 : ce color-mix référence var(--world-accent) et se résout AU NIVEAU
     de DÉCLARATION (:root). Surcharger --world-accent en descendant (ex. inline
     sur <main>) ne le re-dérive PAS ici → il faut RE-DÉCLARER --world-bg-tint au
     niveau de la surcharge pour un tint réellement per-monde (cf. MapScreen
     `worldMainStyle`). Ce défaut :root reste le repli NEUTRE.
     Story #199 : `<main>` consomme désormais ce tint comme SON FOND RÉEL dès qu'un thème est
     résolu — plus seulement quand une photo existe (avant #199, la variable était re-dérivée
     mais jamais PEINTE dans l'état sans-image : déclaré ≠ consommé, #125/#180). Sûr sans scrim
     car la palette d'accent qui l'alimente est BORNÉE (6 thèmes curatés, `CURATED_THEMES` —
     jamais une couleur IA arbitraire comme une photo) : contraste titre/nœuds/trait prouvé
     analytiquement pour les 6 accents × 2 thèmes (MapScreen.test.tsx). */
  --world-bg-tint:  color-mix(in srgb, var(--world-accent) 10%, var(--color-bg-secondary));
  /* surface opaque du thème → scrim de contraste sous le titre quand un fond-image
     réel du monde est rendu (garantit la lisibilité indépendamment de la photo).
     Story #202 : généralisé aussi au bouton de bas d'écran (« Changer de joueur »,
     `FooterScrim`/MapScreen) ET à la casing du trait de chemin (`--map-node-path-casing-width`,
     NodeConnector) — même besoin (glyphe/trait peint sur une photo ARBITRAIRE, contraste non
     garantissable analytiquement, #170) que le scrim du titre (#189). */
  --world-surface:  var(--color-bg-secondary);
}

/* =============================================================
   DARK MODE — plum profond chaud, contraste adouci (pas de noir pur)
   ============================================================= */
[data-theme="dark"] {
  --color-bg-primary:        #1C1830;
  --color-bg-secondary:      #272240;
  --color-bg-tertiary:       #322C4E;
  --color-bg-inverse:        #FAF7FF;

  --color-text-primary:      #ECE8F7; /* off-white, pas blanc pur */
  --color-text-secondary:    #B5AED0;
  --color-text-tertiary:     #837C9E;
  --color-text-inverse:      #29243D;
  --color-text-link:         #B7A6FF;

  --color-border-primary:    #3A3458;
  --color-border-secondary:  #2E2948;
  --color-border-focus:      #3FD9CC;

  --color-accent-primary:        #9B82FF;
  --color-accent-primary-hover:  #AD97FF;
  --color-accent-primary-active: #8B6FF5;
  --color-accent-secondary:      #3FD9CC;

  --color-status-success:    #4ECB73;
  --color-status-warning:    #FFC04D;
  --color-status-error:      #FF8A8A;
  --color-status-error-bg:   #3A211E;
  --color-status-info:       #6FB4FF;

  --color-surface-overlay:   rgba(8, 6, 16, 0.60);

  --color-reward-gold:       #FFD45E;
  --color-reward-coral:      #FF8576;
  --color-coin:              #FFD45E;
  --color-shard:             #3FD9CC;
  --color-star:              #FFD45E;
  --color-star-empty:        #3A3458;

  --color-feedback-correct:     #4ECB73;
  --color-feedback-correct-bg:  #1E3B2A;
  --color-feedback-retry:       #FFC04D;
  --color-feedback-retry-bg:    #3A3018;

  /* ombres dark : noir transparent, pas la teinte violette claire */
  --shadow-sm:    0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-md:    0 6px 16px rgba(0, 0, 0, 0.40);
  --shadow-lg:    0 16px 40px rgba(0, 0, 0, 0.50);
  /* Anneau de focus dark (issue #38) : opacité relevée 0.45→0.6 (même teinte
     `rgb(63,217,204)`) — 0.45 ne franchissait que 2.98:1 sur --color-bg-primary
     dark (#1C1830), sous le seuil WCAG 1.4.11 (≥3:1). 0.6 atteint ≥4:1 sur
     --color-bg-primary ET --color-bg-secondary dark (garde résolue depuis
     tokens.css, cf. globals.css.test.ts). */
  --shadow-focus: 0 0 0 4px rgba(63, 217, 204, 0.6);
}

/* Préférence système, sauf si l'utilisateur a explicitement choisi "light" */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg-primary:        #1C1830;
    --color-bg-secondary:      #272240;
    --color-bg-tertiary:       #322C4E;
    --color-bg-inverse:        #FAF7FF;

    --color-text-primary:      #ECE8F7;
    --color-text-secondary:    #B5AED0;
    --color-text-tertiary:     #837C9E;
    --color-text-inverse:      #29243D;
    --color-text-link:         #B7A6FF;

    --color-border-primary:    #3A3458;
    --color-border-secondary:  #2E2948;
    --color-border-focus:      #3FD9CC;

    --color-accent-primary:        #9B82FF;
    --color-accent-primary-hover:  #AD97FF;
    --color-accent-primary-active: #8B6FF5;
    --color-accent-secondary:      #3FD9CC;

    --color-status-success:    #4ECB73;
    --color-status-warning:    #FFC04D;
    --color-status-error:      #FF8A8A;
    --color-status-error-bg:   #3A211E;
    --color-status-info:       #6FB4FF;

    --color-surface-overlay:   rgba(8, 6, 16, 0.60);

    --color-reward-gold:       #FFD45E;
    --color-reward-coral:      #FF8576;
    --color-coin:              #FFD45E;
    --color-shard:             #3FD9CC;
    --color-star:              #FFD45E;
    --color-star-empty:        #3A3458;

    --color-feedback-correct:     #4ECB73;
    --color-feedback-correct-bg:  #1E3B2A;
    --color-feedback-retry:       #FFC04D;
    --color-feedback-retry-bg:    #3A3018;

    --shadow-sm:    0 1px 2px rgba(0, 0, 0, 0.30);
    --shadow-md:    0 6px 16px rgba(0, 0, 0, 0.40);
    --shadow-lg:    0 16px 40px rgba(0, 0, 0, 0.50);
    /* Miroir du bloc [data-theme="dark"] ci-dessus (issue #38, contraste ≥3:1). */
    --shadow-focus: 0 0 0 4px rgba(63, 217, 204, 0.6);
  }
}

/* Respect de la réduction de mouvement */
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-instant: 0ms;
    --duration-fast:    0ms;
    --duration-normal:  0ms;
    --duration-slow:    0ms;
    --duration-slower:  0ms;
  }
}

/* TEDDy — carnet parent. Scoped aliases preserve the child scenes. */
:root {
  --parent-paper: #fbf5e7;
  --parent-ground: #ebeadd;
  --parent-ink: #243c41;
  --parent-muted: #4e6364;
  --parent-line: #788d86;
  --parent-soft: #e0e8db;
  --parent-accent: #285951;
  --parent-accent-ink: #fbf5e7;
  --parent-gold: #f7cd81;
  --parent-night: #142e34;
  --parent-mint: #bce8cc;
  --parent-width: 1180px;
  --parent-stat-size: clamp(1.75rem, 3vw, 2.5rem);
  --parent-title-size: clamp(2rem, 4vw, 3.25rem);
  --parent-preview-height: 240px;
}
:root[data-theme="dark"] {
  --parent-paper: #203940;
  --parent-ground: #12292e;
  --parent-ink: #fbf5e7;
  --parent-muted: #cad7cd;
  --parent-line: #89a69c;
  --parent-soft: #304c50;
  --parent-accent: #bce8cc;
  --parent-accent-ink: #142e34;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --parent-paper: #203940;
    --parent-ground: #12292e;
    --parent-ink: #fbf5e7;
    --parent-muted: #cad7cd;
    --parent-line: #89a69c;
    --parent-soft: #304c50;
    --parent-accent: #bce8cc;
    --parent-accent-ink: #142e34;
  }
}
.parent-shell, .parent-recovery {
  --color-bg-primary: var(--parent-ground);
  --color-bg-secondary: var(--parent-paper);
  --color-bg-tertiary: var(--parent-soft);
  --color-text-primary: var(--parent-ink);
  --color-text-secondary: var(--parent-muted);
  --color-text-inverse: var(--parent-accent-ink);
  --color-border-primary: var(--parent-line);
  --color-border-focus: var(--parent-accent);
  --color-accent-primary: var(--parent-accent);
  --card-bg: var(--parent-paper);
  --keypad-key-bg: var(--parent-soft);
  --keypad-key-text: var(--parent-ink);
  --shadow-focus: 0 0 0 3px var(--parent-accent);
}

/* World scenery keeps a fixed, readable HUD over every environment. */
:root {
  --world-scene-shade: #14212e80;
  --world-scene-floor-shade: #14212eaa;
  --world-preview-bar: #142e34;
}
.forest {
  position: relative;
  isolation: isolate;
  min-height: 100dvh;
  background: var(--forest-bg);
  color: var(--forest-cream);
  font-family: var(--font-family-body);
  overflow: hidden;
}
.forest * {
  box-sizing: border-box;
}
.forest button,
.forest input {
  font: inherit;
}
.forest button,
.forest a {
  touch-action: manipulation;
}
.forest button {
  cursor: pointer;
}
.forest button:disabled {
  cursor: wait;
}
.forest :is(button, a, input):focus-visible {
  outline: 3px solid var(--forest-gold-edge);
  outline-offset: 4px;
}
.forest :is(h1, h2)[tabindex="-1"]:focus {
  outline: none;
}
.forest h1,
.forest h2,
.forest-brand {
  font-family: var(--font-family-display);
  font-weight: 700;
}
.forest h1 {
  font-size: clamp(2.5rem, 4.6vw, 4rem);
  line-height: 1.04;
  letter-spacing: -0.035em;
  margin: var(--space-3) 0;
  text-wrap: balance;
}
.forest h2 {
  font-size: var(--font-size-xl);
  line-height: 1.15;
  margin: 0 0 var(--space-3);
  text-wrap: balance;
}
.forest p {
  margin: 0 0 var(--space-4);
  line-height: 1.55;
}
.forest-renderer {
  position: absolute;
  inset: 0;
  z-index: -2;
  pointer-events: none;
}
.forest-renderer .tp-scene,
.forest-renderer .tp-world {
  position: absolute;
  inset: 0;
}
.forest-renderer canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.forest-vignette {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #09251f66, transparent 65%);
  box-shadow: inset 0 -120px 100px -60px #09251fbb;
}
.forest-renderer .tp-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--forest-bg);
}
.forest-renderer .tp-loading[hidden] {
  display: none;
}
.forest-fallback {
  position: absolute;
  right: var(--space-5);
  top: var(--space-10);
  max-width: var(--forest-panel-width);
  padding: var(--space-4);
}
.forest-kicker {
  font-size: var(--font-size-xs);
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.forest-brand {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--font-size-xl);
  text-decoration: none;
  color: var(--forest-cream);
}
.forest-brand span {
  color: var(--forest-gold);
}
.forest-primary,
.forest-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-5);
  min-height: var(--tap-target-min);
  text-decoration: none;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--border-radius-sm) var(--border-radius-lg);
  font-weight: 800;
  text-align: center;
}
.forest-primary {
  border: 1px solid var(--forest-gold-edge);
  border-bottom-width: 4px;
  color: var(--forest-ink);
  background: var(--forest-gold);
  box-shadow: var(--forest-shadow);
}
.forest-primary:hover {
  background: var(--forest-cream);
}
.forest-secondary {
  border: 1px solid var(--forest-line);
  background: var(--forest-paper);
  color: var(--forest-ink);
}
.forest-help-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap-target-min);
  background: none;
  border: 0;
  padding: var(--space-2);
  text-decoration: underline;
  text-underline-offset: 4px;
  color: inherit;
  font-weight: 700;
}
.forest-adventure {
  min-height: max(100dvh, var(--forest-viewport-min));
}
.forest-hud {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-5) var(--space-6);
}
.forest-comfort {
  display: flex;
  gap: var(--space-2);
}
.forest-comfort button {
  min-height: var(--tap-target-min);
  border: 1px solid var(--forest-line);
  border-radius: var(--border-radius-full);
  background: var(--forest-deep);
  color: var(--forest-cream);
  padding: var(--space-2) var(--space-4);
  font-size: var(--font-size-sm);
  font-weight: 700;
}
.forest-comfort kbd {
  margin-left: var(--space-2);
  font-size: var(--font-size-xs);
}
.forest-progress {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--border-radius-full);
  background: var(--forest-deep);
  font-size: var(--font-size-xs);
  font-weight: 800;
}
.forest-lights {
  display: flex;
  gap: var(--space-1);
}
.forest-lights i {
  width: 8px;
  height: 8px;
  border: 1px solid var(--forest-line);
  border-radius: 50%;
}
.forest-lights i[data-lit="true"] {
  background: var(--forest-gold);
  box-shadow: 0 0 9px var(--forest-gold);
}
.forest-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-end;
  min-height: calc(max(100dvh, var(--forest-viewport-min)) - 150px);
  padding: var(--space-5) var(--space-6) var(--space-6);
}
.forest-chapter {
  position: absolute;
  top: var(--space-5);
  left: var(--space-6);
  max-width: var(--forest-panel-width);
  text-shadow: 0 3px 18px var(--forest-deep);
}
.forest-chapter .forest-kicker {
  color: var(--forest-mint);
}
.forest-panel {
  width: var(--forest-panel-width);
  max-width: 100%;
  background: var(--forest-cream);
  color: var(--forest-ink);
  border: 2px solid var(--forest-gold);
  border-radius: var(--border-radius-lg);
  padding: var(--space-5);
  box-shadow: var(--forest-shadow);
  text-align: center;
}
.forest-panel p:not(.forest-help-result, .forest-equation) {
  font-size: var(--font-size-sm);
}
.forest-story-panel {
  background: var(--forest-deep);
  color: var(--forest-cream);
  text-align: left;
  border: 1px solid var(--forest-line);
}
.forest-story-panel .forest-kicker {
  color: var(--forest-gold);
}
.forest-story-panel p {
  font-size: var(--font-size-base) !important;
}
.forest-equation {
  font-size: var(--font-size-3xl) !important;
  letter-spacing: 0.02em;
  margin: var(--space-2) 0 var(--space-4) !important;
}
.forest-answers {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-2);
}
.forest-answers button {
  position: relative;
  min-height: 72px;
  border: 1px solid var(--forest-line);
  border-bottom-width: 3px;
  border-radius: var(--border-radius-sm);
  color: var(--forest-ink);
  background: var(--forest-paper);
  font: 700 var(--font-size-xl) var(--font-family-display);
}
.forest-answers button:hover,
.forest-keypad button:hover {
  background: var(--forest-soft);
}
.forest-answers kbd {
  position: absolute;
  top: var(--space-1);
  left: var(--space-2);
  font: 700 var(--font-size-xs) var(--font-family-body);
  color: var(--forest-muted);
}
.forest-input-row {
  display: flex;
  justify-content: center;
  gap: var(--space-3);
}
.forest-input-row input {
  width: 38%;
  min-width: 0;
  border: 2px solid var(--forest-line);
  border-radius: var(--border-radius-sm);
  color: var(--forest-ink);
  background: var(--forest-paper);
  text-align: center;
  font: 700 var(--font-size-2xl) var(--font-family-display);
}
.forest-keypad {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--space-2);
  margin-top: var(--space-3);
}
.forest-keypad button {
  min-height: var(--tap-target-min);
  border: 1px solid var(--forest-line);
  border-radius: var(--border-radius-sm);
  background: var(--forest-paper);
  color: var(--forest-ink);
  font-weight: 800;
}
.forest-help-link {
  margin-top: var(--space-3);
  font-size: var(--font-size-sm);
}
.forest-scaffold {
  margin: var(--space-5) 0;
  overflow: auto;
}
.forest-tenframe {
  display: grid;
  grid-template-columns: repeat(5, 36px);
  gap: var(--space-2);
  justify-content: center;
}
.forest-tenframe i {
  width: 36px;
  height: 36px;
  border: 2px solid var(--forest-line);
  border-radius: var(--border-radius-sm);
  background: var(--forest-paper);
}
.forest-tenframe i[data-filled="true"] {
  background: var(--forest-dot);
  box-shadow: inset 0 0 0 4px var(--forest-paper);
}
.forest-tenframe i[data-added="true"] {
  background: var(--forest-added);
  box-shadow: inset 0 0 0 4px var(--forest-paper);
}
.forest-matrix {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-1);
}
.forest-matrix > div {
  display: flex;
  gap: var(--space-1);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--border-radius-sm);
}
.forest-matrix > div[data-lit="true"] {
  background: var(--forest-gold);
}
.forest-matrix i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--forest-dot);
}
.forest-line {
  display: flex;
  padding: var(--space-5) 0 var(--space-2);
  min-width: max-content;
  justify-content: center;
  border-bottom: 2px solid var(--forest-line);
}
.forest-line span {
  flex: 1;
  min-width: 24px;
  position: relative;
  padding: var(--space-1);
  font-size: var(--font-size-xs);
  color: var(--forest-ink);
}
.forest-line span::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -10px;
  height: 7px;
  border-left: 1px solid var(--forest-muted);
}
.forest-line [data-visited="true"] {
  background: var(--forest-gold);
}
.forest-line [data-current="true"]::before {
  content: "▼";
  position: absolute;
  left: 50%;
  top: -20px;
  transform: translateX(-50%);
}
.forest-help-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  justify-content: center;
}
.forest-help-actions button {
  padding: var(--space-3);
  font-size: var(--font-size-sm);
}
.forest-help-result {
  font: 700 var(--font-size-xl) var(--font-family-display);
}
.forest-stars {
  color: var(--forest-star);
  font-size: var(--font-size-2xl) !important;
  letter-spacing: 0.12em;
}
.forest-rewards {
  display: flex;
  justify-content: space-evenly;
  gap: var(--space-4);
}
.forest-rewards strong {
  display: block;
  font: 700 var(--font-size-xl) var(--font-family-display);
}
.forest-saved {
  color: var(--forest-muted);
}
.forest-network {
  margin-top: var(--space-3);
  width: var(--forest-panel-width);
  max-width: 100%;
  border: 1px solid var(--forest-gold);
  border-radius: var(--border-radius-md);
  padding: var(--space-3) var(--space-4);
  background: var(--forest-deep);
  color: var(--forest-cream);
  font-size: var(--font-size-sm);
}
.forest-network p:last-child {
  margin: 0;
}
.forest-network a {
  color: var(--forest-gold);
}
.forest-foot {
  position: absolute;
  left: var(--space-6);
  right: var(--space-6);
  bottom: var(--space-4);
  display: flex;
  justify-content: space-between;
  gap: var(--space-4);
  color: var(--forest-mint);
  font-size: var(--font-size-xs);
}
.forest-pause {
  margin: auto;
  width: var(--forest-panel-width);
  max-width: calc(100% - 32px);
  border: 2px solid var(--forest-gold);
  border-radius: var(--border-radius-lg);
  background: var(--forest-cream);
  color: var(--forest-ink);
  padding: var(--space-6);
  text-align: center;
}
.forest-pause::backdrop {
  background: var(--forest-scrim);
}
.forest-pause button {
  width: 100%;
  margin-bottom: var(--space-3);
}
.forest-map {
  min-height: calc(100dvh - var(--app-shell-height));
}
.forest-map .forest-vignette {
  background: linear-gradient(#09251f55, #09251fb0);
}
.forest-map-content {
  max-width: 1440px;
  margin: auto;
  padding: var(--space-5) var(--space-6);
}
.forest-map-heading {
  max-width: 680px;
  text-shadow: 0 3px 18px var(--forest-deep);
}
.forest-map-heading p {
  max-width: 520px;
}
.forest-map-stage {
  height: var(--forest-stage-height);
  position: relative;
  margin: var(--space-4) 0;
}
.forest-map-path {
  position: absolute;
  inset: 0;
  height: 100%;
  width: 100%;
  overflow: visible;
}
.forest-map-path polyline {
  fill: none;
  stroke: var(--forest-gold);
  stroke-width: 3px;
  stroke-dasharray: 3 8;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
}
.forest-map-nodes {
  margin: 0;
  padding: 0;
  list-style: none;
}
.forest-map-nodes li {
  position: absolute;
  left: var(--node-x);
  top: var(--node-y);
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 95px;
}
.forest-node {
  display: grid;
  place-items: center;
  width: var(--forest-node-size);
  height: var(--forest-node-size);
  border-radius: 50%;
  border: 2px solid var(--forest-line);
  background: var(--forest-deep);
  color: var(--forest-cream);
  text-decoration: none;
  font: 700 var(--font-size-lg) var(--font-family-display);
  box-shadow: 0 4px 16px var(--forest-deep);
}
[data-status="current"] .forest-node {
  border: 3px solid var(--forest-cream);
  background: var(--forest-gold);
  color: var(--forest-ink);
  box-shadow:
    0 0 0 8px #efd28e33,
    0 0 40px #efd28e44;
}
[data-status="completed"] .forest-node {
  background: var(--forest-mint);
  color: var(--forest-ink);
}
.forest-node-caption {
  position: absolute;
  top: calc(var(--forest-node-size) + 10px);
  padding: var(--space-1) var(--space-2);
  border-radius: var(--border-radius-sm);
  text-align: center;
  font-size: var(--font-size-xs);
  line-height: 1.2;
  background: var(--forest-deep);
  color: var(--forest-cream);
  white-space: nowrap;
}
[data-status="current"] .forest-node-caption {
  background: var(--forest-gold);
  color: var(--forest-ink);
  font-weight: 800;
}
.forest-map-bottom {
  display: flex;
  justify-content: space-between;
  gap: var(--space-6);
  align-items: flex-end;
}
.forest-mission {
  width: var(--forest-panel-width);
  max-width: 100%;
  border: 1px solid var(--forest-line);
  border-radius: var(--border-radius-lg);
  padding: var(--space-5);
  background: var(--forest-deep);
  box-shadow: var(--forest-shadow);
}
.forest-mission .forest-kicker {
  color: var(--forest-gold);
}
.forest-mission p {
  font-size: var(--font-size-sm);
}
.forest-mission small {
  display: block;
  color: var(--forest-mint);
  margin-top: var(--space-3);
}
.forest-guardian {
  max-width: 340px;
  text-align: right;
  padding: var(--space-5);
  background: var(--forest-deep);
  border-radius: var(--border-radius-lg);
}
.forest-guardian > span {
  font-size: var(--font-size-3xl);
  color: var(--forest-gold);
}
.forest-guardian p {
  font-size: var(--font-size-sm);
}
.forest-guardian nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  justify-content: flex-end;
}
.forest-guardian a {
  color: var(--forest-mint);
  min-height: var(--tap-target-min);
  display: inline-flex;
  align-items: center;
  font-size: var(--font-size-sm);
}
.forest-shell {
  --topbar-bg: var(--forest-deep);
  --topbar-border: var(--forest-line);
  --topbar-coin-tint: var(--forest-bg);
  --topbar-shard-tint: var(--forest-bg);
  --color-text-primary: var(--forest-cream);
  --color-text-secondary: var(--forest-mint);
  --color-border-primary: var(--forest-line);
}
.forest-home {
  --card-bg: var(--forest-cream);
  --color-text-primary: var(--forest-ink);
  --color-text-secondary: var(--forest-muted);
  --color-bg-secondary: var(--forest-paper);
  --color-border-primary: var(--forest-line);
  --color-accent-primary: var(--forest-ink);
  --color-text-inverse: var(--forest-cream);
}
.forest-home > main {
  background: transparent !important;
  position: relative;
  padding: var(--space-6) !important;
  justify-content: flex-start !important;
}
.forest-home > main > div {
  margin: 0 !important;
  max-width: 400px !important;
}
.forest-home-heading {
  position: absolute;
  right: var(--space-8);
  top: var(--space-10);
  width: 400px;
  max-width: 35%;
  text-shadow: 0 4px 20px var(--forest-deep);
}
.forest-home-heading h2 {
  font-size: var(--font-size-3xl);
}
@media (max-width: 800px) {
  .forest-hud {
    flex-wrap: wrap;
    padding: var(--space-4);
    gap: var(--space-2);
  }
  .forest-progress {
    order: 3;
    justify-content: center;
    width: 100%;
  }
  .forest-comfort button {
    padding: var(--space-2) var(--space-3);
    font-size: var(--font-size-xs);
  }
  .forest-comfort kbd {
    display: none;
  }
  .forest-content {
    padding: var(--space-4) var(--space-4) var(--space-7);
    min-height: calc(max(100dvh, 800px) - 160px);
  }
  .forest-adventure {
    min-height: max(100dvh, 800px);
  }
  .forest-chapter {
    left: var(--space-5);
    top: var(--space-4);
    max-width: 85%;
  }
  .forest-panel {
    padding: var(--space-4);
  }
  .forest-foot {
    left: var(--space-4);
    right: var(--space-4);
  }
  .forest-foot span:last-child {
    display: none;
  }
  .forest-answers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .forest-keypad {
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-1);
  }
  .forest-map-content {
    padding: var(--space-5) var(--space-4);
  }
  .forest-map-stage {
    height: auto;
    margin: var(--space-6) 0;
  }
  .forest-map-path {
    display: none;
  }
  .forest-map-nodes {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-7) var(--space-2);
  }
  .forest-map-nodes li {
    position: relative;
    top: auto;
    left: auto;
    transform: none;
    width: auto;
    min-height: 80px;
  }
  .forest-node-caption {
    white-space: normal;
    width: 100%;
  }
  .forest-map-bottom {
    flex-direction: column;
    align-items: stretch;
  }
  .forest-guardian {
    max-width: none;
    text-align: left;
  }
  .forest-guardian nav {
    justify-content: flex-start;
  }
  .forest-home-heading {
    display: none;
  }
  .forest-home > main {
    justify-content: center !important;
    padding: var(--space-4) !important;
  }
}
@media (prefers-reduced-motion: reduce) {
  .forest *,
  .forest *::before,
  .forest *::after {
    animation: none !important;
    transition: none !important;
  }
}
.forest[data-reduced="true"] * {
  animation: none !important;
  transition: none !important;
}

/* The backdrop is also usable without WebGL; AssetImage validates every reference. */
.world-backdrop {
  position: absolute;
  inset: 0;
  background: var(--forest-bg);
}
.world-backdrop img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
}
.forest[data-world] .forest-vignette {
  background: linear-gradient(90deg, var(--world-scene-shade), transparent 65%);
  box-shadow: inset 0 -120px 100px -60px var(--world-scene-floor-shade);
}
.forest-chapter,
.forest-map-heading {
  width: fit-content;
  background: var(--forest-deep);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--border-radius-lg);
  text-shadow: none;
}
.forest-brand,
.forest-foot {
  background: var(--forest-deep);
  border-radius: var(--border-radius-sm);
  padding: var(--space-2);
}
.forest-fallback {
  background: var(--forest-deep);
  color: var(--forest-cream);
  border-radius: var(--border-radius-sm);
}
.world-preview-controls {
  position: relative;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--world-preview-bar);
  color: var(--forest-cream);
}
.world-preview-controls select,
.world-preview-controls button {
  min-height: var(--tap-target-min);
  font: inherit;
  padding: var(--space-2);
  border-radius: var(--border-radius-sm);
  color: var(--forest-ink);
  background: var(--forest-cream);
}
